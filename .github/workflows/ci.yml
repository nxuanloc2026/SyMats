# Builds and tests every pull request. This is the quality gate for all agents.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Boost.Odeint/Boost.Math are header-only; the Boost numeric backends are built on Linux.
      - name: Install Boost headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Configure
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSYMATS_USE_BOOST=ON

      - name: Configure
        if: runner.os != 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
