# Runs Claude Code in GitHub Actions when someone writes "@claude" in an issue or PR,
# or when an issue gets the "agent:claude" label.
# Requires repository secret CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max) or ANTHROPIC_API_KEY.
name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent:claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and math libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgmp-dev libmpfr-dev libflint-dev

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow AGENTS.md. Work on this issue in your own branch and open a pull request.
            Make sure the project builds and all tests pass before finishing.
