name: Release Windows Software

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        # Static CRT keeps the portable CLI independent of a separately installed
        # Visual C++ runtime. The notebook host and xeus are not packaged yet.
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DSYMATS_BUILD_CLI=ON -DSYMATS_BUILD_KERNEL=OFF -DSYMATS_BUILD_TESTS=ON

      - name: Build C++ Software Executables
        run: cmake --build build --config Release --parallel

      - name: Test C++ Software
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create Windows Software Distribution Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDirectory build

      - name: Verify repeat packaging and extracted executable
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -BuildDirectory build
          ./scripts/test-windows-package.ps1

      - name: Upload Windows Software Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symats-windows-x64
          path: out/windows-release/symats-windows-x64.zip
          if-no-files-found: error
